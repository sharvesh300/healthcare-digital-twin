[project]
name = "healthcare-digital-twin"
version = "0.1.0"
description = "Composite patient digital twin: real CGM/wearable data (CGMacros) + synthetic EHR history (Synthea) on TimescaleDB and HAPI FHIR"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pandas>=2.3",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1.3",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
twin = "twin.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "websockets>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
